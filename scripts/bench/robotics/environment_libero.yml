# Run conda env create from the LightX2V repository root.
# Shared by LIBERO and LIBERO-Plus; workers select the benchmark source tree.
name: lightx2v-libero
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - cmake<4
  - ninja
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128
      - numpy==1.26.4
      - transformers==4.49.0
      - diffusers==0.35.1
      - peft==0.17.1
      - opencv-python==4.11.0.86
      - setuptools<81
      - wheel
      # Conda runs pip from the directory containing this file.
      - -e ../../..
      - mujoco==3.3.2
      - robosuite==1.4.0
      - robomimic==0.2.0
      - bddl==1.0.1
      - gym==0.25.2
      - cloudpickle==2.1.0
      - easydict==1.9
      - hydra-core==1.3.2
      - future
      - thop
      - wand
      - scikit-image
      - h5py
      - matplotlib
      - termcolor
