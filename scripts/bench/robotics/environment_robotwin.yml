# Run conda env create from the LightX2V repository root.
# Simulator versions match the WAM evaluation setup; CUDA extensions are built separately.
name: lightx2v-robotwin
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - cmake<4
  - ninja
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - torchvision==0.22.1+cu128
      - torchaudio==2.7.1+cu128
      - numpy==1.26.4
      - transformers==4.49.0
      - diffusers==0.35.1
      - peft==0.17.1
      - opencv-python==4.11.0.86
      - setuptools<81
      - wheel
      # Conda runs pip from the directory containing this file.
      - -e ../../..
      - sapien==3.0.0b1
      - mplib==0.2.1
      - gymnasium==0.29.1
      - transforms3d==0.4.2
      - trimesh==4.4.3
      - open3d==0.18.0
      - pyglet<2
      - h5py
      - zarr<3
      - numcodecs<0.16
      - moviepy
      - termcolor
      - matplotlib
      - ffmpeg
      - yourdfpy==0.0.60
      - warp-lang==1.12.0
      - setuptools-scm
      - pybind11
