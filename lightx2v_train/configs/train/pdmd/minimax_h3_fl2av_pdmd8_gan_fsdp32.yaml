seed: 42
model:
    name: minimax_h3_fl2av
    pretrained_model_name_or_path: ${oc.env:H3_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: bf16
    latent_dtype: fp32
    local_files_only: true
    use_autocast: false
    attention_backend: _flash_3_hub
    fake:
        transformer_param_dtype: fp32
    capabilities:
        distribution_matching:
            video_flow_shift: 6.0
            audio_flow_shift: 3.0
            video_loss_weight: 0.8
            audio_loss_weight: 0.8

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 32
        sharded_load: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            cast_forward_inputs: false

data:
    train:
        name: cache_dataset
        data_path: ${oc.env:H3_TRAIN_META}
        tasks: ${oc.decode:${oc.env:H3_TASKS,'[]'}}
        require_targets: false
        batch_size: 1
        num_workers: 8
        seed: 42
        shuffle: true
        pin_memory: true

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.0
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    method: pdmd
    output_dir: ${oc.env:H3_PDMD_OUTPUT,./output_train/h3_fl2av_pdmd8_gan}
    max_train_iters: 3000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    allow_tf32: true
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 2
    dmd:
        num_inference_steps: 8
        fake_update_ratio: 5
        rollout_video_shift: 6.0
        rollout_audio_shift: 3.0
        video_shift_schedule:
            - {start: 0, shift: 6.0}
            - {start: 1500, shift: 12.0}
        critic_video_threshold: 0.95
        critic_audio_floor: 0.85
        gan:
            enabled: true
            student_recompute: true
            generator_weight: 0.005
            discriminator_weight: 0.01
            feature_block: 49
            head_hidden_dim: 1024
            head_temporal_bins: 4
            sigma_max: 0.999
    student:
        train_type: lora
        checkpoint_path: ${oc.env:H3_STUDENT_INIT}
        lora:
            rank: 128
            alpha: 128
            param_dtype: fp32
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2, adaln_proj.linear, norm_out.linear]
            rank_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
            alpha_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
        optimizer:
            learning_rate: 5.0e-5
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 1.0e-8
    fake:
        train_type: full
        optimizer:
            learning_rate: 4.0e-6
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 1.0e-8
    teacher:
        guidance_scale: 1.0
        cfg_norm: none

inference: {method: none}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
