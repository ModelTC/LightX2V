model:
    name: wan_t2v
    pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B
    max_sequence_length: 512
    running_dtype: bf16
    transformer_param_dtype: fp32
    vae_dtype: fp32
    load_vae: true
    load_text_encoder: true
    load_transformer: true
    fake:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B/
    teacher:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B/
        transformer_param_dtype: bf16

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        reshard_after_forward:
            root_reshard: false
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: prompt_dataset
        data_path:
            - data/prompts/wan22_train_prompts.txt
        num_workers: 8
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: prompt_dataset
        data_path:
            - data/prompts/wan22_val_prompts.txt
        max_samples: 2
        num_workers: 0
        shuffle: false

scheduler:
    min_sigma: 0.02
    max_sigma: 0.98
    num_train_timesteps: 1000
    timestep_distribution: uniform
    time_shift_settings:
        do_time_shift: true
        shift_type: linear
        time_shift_mu: 5.0
        time_shift_power: 1.0
        sigma_min: 0.0
        extra_one_step: true

training:
    method: sgmd
    max_train_iters: 1000
    gradient_accumulation_iters: 2
    gradient_checkpointing: true
    max_grad_norm: 10.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 10
    dmd:
        num_inference_steps: 4
        fake_update_ratio: 1
        div_loss:
            enabled: true
            weight: 5.0e-2
            teacher_inference_steps: 30
            anchor_step: 5
        generation_shapes:
            - {value: [81, 480, 832]}
        ts_schedule: false
        ts_schedule_max: false
        same_step_across_blocks: true
        context_noise: 0
    student:
        train_type: full
        optimizer:
            learning_rate: 2.0e-6
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    fake:
        train_type: full
        optimizer:
            learning_rate: 4.0e-7
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    teacher:
        guidance_scale: 3.0
        cfg_norm: none
    output_dir: ./output_train/wan2_1_t2v_1_3b_sgmd

inference:
    method: wan_t2v_infer
    default_width: 832
    default_height: 480
    num_frames: 81
    num_inference_steps: ${training.dmd.num_inference_steps}
    fps: 16
    enable_cfg: false
    cfg_guidance_scale: 1.0
    seed: 42
    output_dir: ./output_infer/wan2_1_t2v_1_3b_sgmd
    infer_every_iters: 10

logging:
    rank_zero_only: true
    train_log_every_iters: 10
    infer_log_every_steps: 10

resume:
    auto_resume: true
