model:
    name: minimax_h3_pruned_vae
    pretrained_model_name_or_path: /data/nvme6/gushiqiao/models/MiniMax-H3
    running_dtype: bf16
    student_param_dtype: fp32
    teacher_encoder_dtype: fp32
    teacher_autocast_dtype: fp32
    student_autocast: true
    load_teacher_encoder: false
    load_teacher_decoder: true
    local_files_only: true
    pruned_decoder:
        selection_path: ${oc.env:H3_VAE_PRUNE_SELECTION,/data/nvme6/gushiqiao/codes/latest/vae/LightX2V/lightx2v_train/output_train/minimax_h3_vit_prune_search_4gpu_ddp/export/kept_layers.json}
        use_tiling: true
        tile_sample_min_height: 256
        tile_sample_min_width: 256
        tile_sample_min_overlap_height: 64
        tile_sample_min_overlap_width: 64

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel: {enabled: false, size: 1}
    dp:
        enabled: true
        broadcast_buffers: false
        find_unused_parameters: false
        gradient_as_bucket_view: true
    fsdp2: {enabled: false}

data:
    processor: {name: minimax_h3_pruned_vae}
    train:
        name: video_dataset
        data_path:
            - /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s_768p/i2av/landscape/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_turbo_vae_latents_5s_768p/fl2av/landscape/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_turbo_vae_latents_5s_768p/l2av/landscape/metadata.jsonl
        latent_column: video_latent_path
        height: 768
        width: 1344
        num_frames: 362
        frame_rate: 24
        fix_frame_rate: false
        time_division_factor: 1
        time_division_remainder: 0
        geometry_from_metadata: true
        random_start: false
        num_workers: 8
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: video_dataset
        data_path: /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s/metadata.jsonl
        latent_column: video_latent_path
        height: 768
        width: 1344
        num_frames: 362
        frame_rate: 24
        fix_frame_rate: false
        time_division_factor: 1
        time_division_remainder: 0
        geometry_from_metadata: true
        random_start: false
        max_samples: 3
        num_workers: 2
        pin_memory: true
        shuffle: false
        drop_last: false

training:
    method: vae_distillation
    train_type: full
    max_train_iters: 3000
    gradient_accumulation_iters: 4
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: cosine
    lr_warmup_iters: 200
    save_every_iters: 100
    save_total_limit: 5
    save_consolidated_weights: true
    consolidated_weights_name: minimax_h3_pruned_vae.safetensors
    optimizer:
        learning_rate: 0.00005
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        adam_epsilon: 0.00000001
    vae_distillation:
        use_spatial_tiling: true
        student_tile_batch_size: 1
        student_window_checkpointing: true
        route_seed: 2026
        charbonnier_epsilon: 0.001
        teacher_tile_batch_size: 1
        teacher_feature_indices: [2, 5, 8, 11, 14, 17, 20, 23, 26, 29, 32, 35]
        feature_loss_type: mse
        teacher_output_weight: 0.0
        temporal_velocity_weight: 0.0
        perceptual_network: vgg
        perceptual_num_frames: 64
        perceptual_frame_batch_size: 2
        perceptual_gradient_checkpointing: true
        auxiliary_decoder:
            # Zero-based student blocks, mapped to teacher blocks 26, 29, 32.
            student_feature_indices: [8, 9, 10]
            reconstruction_weight: 1.0
            spatial_gradient_weight: 0.1
            spatiotemporal_weight: 0.1
            ramp_iters: 200
            gradient_checkpointing: true
        stages:
            - name: reconstruction
              start_iter: 0
              routes: {single: 0.75, temporal_pair: 0.25}
              weights:
                  reconstruction: 1.0
                  feature: 0.01
                  perceptual: 0.1
                  adversarial: 0.0
                  auxiliary: 0.0
            - name: blended_detail
              start_iter: 600
              routes:
                  single: 0.20
                  horizontal_pair: 0.15
                  vertical_pair: 0.15
                  quad: 0.20
                  temporal_pair: 0.20
                  temporal_quad: 0.10
              weights:
                  reconstruction: 1.0
                  feature: 0.005
                  perceptual: 0.2
                  adversarial: 0.5
                  auxiliary: 0.1
        gan:
            enabled: true
            seed: 2026
            crop_specs:
                - {crop_size: 256, max_frames: 32, weight: 0.75}
                - {crop_size: 384, max_frames: 32, weight: 0.25}
            correction_scale: 0.05
            correction_clamp: 4.0
            discriminator_warmup_iters: 100
            generator_ramp_iters: 300
            max_grad_norm: 1.0
            discriminator:
                condition_channels: 8
                base_channels: 32
                channel_multipliers: [1, 2, 4, 8]
                temporal_strides: [1, 1, 2, 2]
                group_norm_groups: 16
                spectral_normalization: true
                gradient_checkpointing: true
            frame_discriminator:
                enabled: true
                weight: 1.0
                condition_channels: 24
                base_channels: 64
                channel_multipliers: [1, 2, 4, 8, 8]
                spatial_strides: [2, 2, 2, 1, 1]
                group_norm_groups: 32
                spectral_normalization: true
                gradient_checkpointing: true
            optimizer:
                learning_rate: 0.00002
                adam_beta1: 0.5
                adam_beta2: 0.9
                weight_decay: 0.0
                adam_epsilon: 0.00000001
    output_dir: ${oc.env:H3_VAE_PRUNE_RECOVER_AUX_3K_OUTPUT,/data/nvme6/gushiqiao/codes/latest/vae/LightX2V/lightx2v_train/output_train/minimax_h3_vit_prune_recover_aux_3k_4gpu_ddp}

inference:
    method: minimax_h3_vae_reconstruction
    infer_every_iters: 100
    output_dir: ${training.output_dir}/previews
    fps: 24
    metric_frame_batch_size: 4
    max_samples: 3
    save_comparison: true
    save_png_frame_count: 6

logging:
    rank_zero_only: true
    train_log_every_iters: 10

resume:
    auto_resume: true
