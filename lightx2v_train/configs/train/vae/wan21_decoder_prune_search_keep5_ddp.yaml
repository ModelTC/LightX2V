model:
    name: wan21_pruned_decoder
    pretrained_model_name_or_path: ${oc.env:WAN_VAE_PATH,/data/nvme6/gushiqiao/models/Sekotalk-ar-2step/Wan2.1_VAE.pth}
    running_dtype: bf16
    student_param_dtype: fp32
    teacher_autocast_dtype: fp32
    student_autocast: true
    pruned_decoder:
        search:
            keep_residuals: 5
            lora_rank: 16
            lora_alpha: 32
            gate_scale: 100.0

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel: {enabled: false, size: 1}
    dp:
        enabled: true
        broadcast_buffers: false
        find_unused_parameters: false
        gradient_as_bucket_view: true
    fsdp2: {enabled: false}

data:
    processor: {name: wan21_pruned_decoder, min_source_frames: 65}
    train:
        name: video_dataset
        data_path:
            - /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s_768p/i2av/landscape/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_turbo_vae_latents_5s_768p/fl2av/landscape/metadata.jsonl
            - /data/nvme6/gushiqiao/datasets/minimax_h3_turbo_vae_latents_5s_768p/l2av/landscape/metadata.jsonl
        height: 384
        width: 384
        num_frames: 65
        frame_rate: 24
        fix_frame_rate: true
        time_division_factor: 4
        time_division_remainder: 1
        geometry_from_metadata: false
        random_start: true
        num_workers: 4
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: video_dataset
        data_path: /data/nvme6/gushiqiao/datasets/minimax_h3_teacher_latents_5s/metadata.jsonl
        height: 512
        width: 512
        num_frames: 65
        frame_rate: 24
        fix_frame_rate: true
        time_division_factor: 4
        time_division_remainder: 1
        geometry_from_metadata: false
        random_start: false
        max_samples: 1
        num_workers: 2
        pin_memory: false
        shuffle: false
        drop_last: false

training:
    method: wan21_decoder_pruning
    train_type: full
    max_train_iters: 1000
    gradient_accumulation_iters: 4
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: cosine
    lr_warmup_iters: 50
    save_every_iters: 100
    save_total_limit: 5
    save_consolidated_weights: false
    consolidated_weights_name: wan21_pruned_decoder.safetensors
    optimizer:
        learning_rate: 0.0001
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        adam_epsilon: 0.00000001
    pruning:
        tau_start: 4.0
        tau_end: 0.1
        gate_lr_multiplier: 10.0
        ema_decay: 0.999
        export_dir: ${training.output_dir}/export
    vae_distillation:
        crop_seed: 2026
        charbonnier_epsilon: 0.001
        perceptual_network: vgg
        perceptual_num_frames: 32
        perceptual_frame_batch_size: 2
        perceptual_gradient_checkpointing: true
        stages:
            - name: structure_search
              start_iter: 0
              crop_num_frames: 33
              crop_size: 256
              weights: {reconstruction: 1.0, perceptual: 0.05}
        gan: {enabled: false}
    output_dir: ${oc.env:WAN_VAE_DECODER_SEARCH_OUTPUT,/data/nvme6/gushiqiao/codes/latest/vae/LightX2V/lightx2v_train/output_train/wan21_decoder_prune_search_keep5_ddp}

inference:
    method: wan21_vae_reconstruction
    infer_every_iters: 100
    output_dir: ${training.output_dir}/previews
    fps: 24
    metric_frame_batch_size: 4
    max_samples: 1
    save_comparison: true
    save_png_frame_count: 6

logging:
    rank_zero_only: true
    train_log_every_iters: 10

resume:
    auto_resume: true
