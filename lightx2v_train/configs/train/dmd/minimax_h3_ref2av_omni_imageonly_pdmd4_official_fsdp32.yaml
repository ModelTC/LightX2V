# PDMD official-source training flow, adapted to the existing H3 Ref cache.
# Reference: ZeamoxWang/pdmd @ 6b6e10635495a2d9b989fee393235d406d3840c4,
# training/configs/pdmd_4nfe_544p.json and src/pdmd/{engine,schedule,objectives}.py.
# Deliberate user overrides: student LoRA rank128/alpha8 with FP32 parameters,
# full-parameter fake, existing base/compute precision, Ref2AV Omni image-only cache,
# 768p metadata geometry and count_random global batch32 sampling.
# IMPORTANT: 250000 iterations count SINGLE optimizer updates (208334 fake +
# 41666 student), not outer rounds. Save every 50; use a NEW output directory.
seed: 42
model:
    name: minimax_h3_ref2av
    pretrained_model_name_or_path: ${oc.env:H3_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: bf16
    local_files_only: true
    patch_size: [1, 2, 2]
    video_latent_channels: 24
    audio_latent_channels: 32
    text_dim: 5120
    vae_spatial_scale_factor: 16
    use_autocast: false
    attention_backend: _flash_3_hub
    fake:
        transformer_param_dtype: fp32
    teacher:
        transformer_param_dtype: bf16
    capabilities:
        distribution_matching:
            # Inference shifts only. Official training supplies explicit
            # video/audio physical sigmas from unshifted rollout grids below.
            video_flow_shift: 12.0
            audio_flow_shift: 3.0
            video_loss_weight: 0.8
            audio_loss_weight: 0.8
            audio_dmd_loss_weight: 0.8
            geometry_from_metadata: true
            allowed_resolutions: [[768, 1344], [1344, 768]]
            dmd_normalization: true
            dmd_normalization_epsilon: 0.0
            dmd_reduction: mean
            projected_dmd: true
            official_pdmd: true
            official_pdmd_normalizer_floor: 0.00001
            official_pdmd_projection_epsilon: 0.00000001
            official_pdmd_loss_clamp: 5.0

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 32
        stream_load_pretrained: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: minimax_h3_ref_cache_dataset
        data_path: ${oc.env:H3_REF2AV_CACHE}
        defer_latent_loading: true
        batch_size: 1
        num_workers: 8
        pin_memory: true
        shuffle: false
        drop_last: true
        reference_cost_sampler:
            seed: 42
            batch_mode: count_random
            require_image_only: true
            image_counts: [1, 2, 3, 4, 5, 6]
            require_all_image_counts: false
            balance_image_counts: true
            cost_key: packed_sequence_tokens_124
            require_compute_cost: true
            balance_orientation: false
            strict_full_epoch: false
            remainder_policy: rotating_drop

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.0
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    method: dmd
    max_train_iters: 250000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 50
    # Local storage policy: unlike LoRA-only upstream, our fake is full-size.
    save_total_limit: 5
    dmd:
        official_pdmd: true
        num_inference_steps: 4
        update_order: fake_first
        fake_update_ratio: 5
        model_mode: eval
        latent_dtype: fp32
        official_rollout_video_shift: 1.0
        official_rollout_audio_shift: 1.0
        critic_video_threshold: 0.95
        critic_audio_floor: 0.85
        generation_shapes:
            - {value: [124, 768, 1344]}
        # Initialization-only fallback; the official loop owns interval-local
        # student queries and independent per-modality critic sigma sampling.
        score_sampling:
            type: continuous_uniform
            min_sigma: 0.0
            max_sigma: 1.0
    student:
        train_type: lora
        lora:
            rank: 128
            alpha: 8
            # Adapter-only master dtype; frozen base and FSDP compute stay BF16.
            param_dtype: fp32
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
        optimizer:
            learning_rate: 0.00005
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    fake:
        train_type: full
        optimizer:
            learning_rate: 0.00001
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    teacher: {guidance_scale: 1.0, cfg_norm: none}
    output_dir: ${oc.env:H3_REF2AV_DMD_OUTPUT}

inference: {method: none, infer_every_iters: null}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
