# Eight-step DMAD adapted to reference-conditioned H3, four ACP workers x eight GPUs.
# Source: Yzmblog/DMAD, commit 8067c05f74a8cfc818d6e21c2b49405b49ba9cbc.
# This is NOT the paper's T2AV reproduction: Ref2AV data/sampling, global gap
# synchronization, and FP32 master parameters are intentional adaptations.
model:
    name: minimax_h3_ref2av
    pretrained_model_name_or_path: ${oc.env:H3_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: fp32
    local_files_only: true
    patch_size: [1, 2, 2]
    video_latent_channels: 24
    audio_latent_channels: 32
    text_dim: 5120
    vae_spatial_scale_factor: 16
    use_autocast: false
    attention_backend: _flash_3_hub
    fake:
        transformer_param_dtype: fp32
    capabilities:
        distribution_matching:
            video_flow_shift: 12.0
            audio_flow_shift: 2.0
            geometry_from_metadata: true
            fixed_num_frames: 124
            allowed_resolutions: [[768, 1344], [1344, 768]]
            projected_dmd: false

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 32
        stream_load_pretrained: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: minimax_h3_dmad_dataset
        data_path: ${oc.env:H3_DMAD_CACHE}
        batch_size: 1
        num_workers: 0
        pin_memory: false
        shuffle: false
        drop_last: true
        # Ref2AV-specific balancing, not part of the published DMAD recipe.
        # Customize this in a separate YAML through H3_DMAD_CONFIG if needed.
        reference_cost_sampler:
            seed: 42
            batch_mode: cost_local
            require_image_only: true
            image_counts: [1, 2, 3, 4, 5, 6]
            require_all_image_counts: false
            balance_image_counts: true
            cost_key: packed_sequence_tokens_124
            require_compute_cost: true
            balance_orientation: true
            strict_full_epoch: false
            remainder_policy: rotating_drop

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.02
    max_sigma: 0.98
    time_shift_settings: {do_time_shift: false}

training:
    method: dmad
    max_train_iters: ${oc.env:H3_DMAD_MAX_ITERS,800}
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 8
    dmd:
        num_inference_steps: 8
        update_order: student_first
        fake_update_ratio: 1
        model_mode: legacy_train
        latent_dtype: fp32
        generation_shapes:
            - {value: [124, 768, 1344]}
        residual_head: {enabled: false}
    dmad:
        feature_block: 49
        gap_tau: 2.0
        lambda_real: 1.0
        lambda_teacher: 1.0
        gap_sync: true
        ema_gammas: [6.94, 16.97]
        renoise_sigma_min: 0.02
        renoise_sigma_max: 0.98
    student:
        train_type: lora
        # DMAD maintains its own power-function EMA banks.
        ema: {enabled: false}
        lora:
            rank: 128
            alpha: 128
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
        optimizer:
            learning_rate: 0.00004
            adam_beta1: 0.0
            adam_beta2: 0.99
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    fake:
        train_type: lora
        lora:
            rank: 128
            alpha: 128
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
        optimizer:
            learning_rate: 0.00004
            adam_beta1: 0.0
            adam_beta2: 0.99
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    # No online teacher model: paired offline teacher latents supply Q.
    output_dir: ${oc.env:H3_DMAD_OUTPUT}

inference: {method: none, infer_every_iters: null}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
