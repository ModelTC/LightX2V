model:
    name: qwen_image_edit
    pretrained_model_name_or_path: /root/yongyang/models/Qwen/Qwen-Image-Edit-2511
    fake:
        name: qwen_image_edit
        pretrained_model_name_or_path: ${model.pretrained_model_name_or_path}
    teacher:
        name: qwen_image_edit
        pretrained_model_name_or_path: ${model.pretrained_model_name_or_path}
    max_sequence_length: 1024
    running_dtype: bf16

distributed:
    backend: nccl
    timeout_minutes: 120
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        log_memory: true
        reshard_after_forward:
            root_reshard: true
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: cache_dataset
        num_workers: 4
        prompt_dropout_rate: 0.0
        target_area: 1048576 # 1024 * 1024; edit preprocessing preserves source aspect ratio.
        shuffle: true
        data_path:
            - /root/yongyang/data/qwen_edit_cache/train/cache_data.jsonl
    val:
        name: cache_dataset
        num_workers: 2
        prompt_dropout_rate: 0.0
        target_area: ${data.train.target_area}
        shuffle: false
        data_path:
            - /root/yongyang/data/qwen_edit_cache/val/cache_data.jsonl

scheduler:
    min_sigma: 0.02
    max_sigma: 0.98
    num_train_timesteps: 1000
    time_shift_settings:
        do_time_shift: true
        shift_type: exponential
        time_shift_power: 1.0
        dynamic_shift: true
        shift_mu_strategy: linear
        patch_size: [2, 2]
        shift_x1: 256
        shift_x2: 8192
        shift_y1: 0.5
        shift_y2: 0.9

training:
    # The registered trainer name is dmd, including alternating student/fake updates.
    method: dmd
    max_train_iters: 1000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 10
    save_every_iters: 100
    save_total_limit: 10
    dmd:
        num_inference_steps: 4
        fake_update_ratio: 2
    student:
        train_type: lora
        lora:
            rank: 32
            alpha: 32
            target_modules:
                - to_k
                - to_q
                - to_v
                - to_out.0
        optimizer:
            learning_rate: 0.0001
            adam_beta1: 0.9
            adam_beta2: 0.999
            weight_decay: 0.001
            adam_epsilon: 0.00000001
    fake:
        train_type: lora
        lora:
            rank: 32
            alpha: 32
            target_modules:
                - to_k
                - to_q
                - to_v
                - to_out.0
        optimizer:
            learning_rate: 0.00002
            adam_beta1: 0.9
            adam_beta2: 0.999
            weight_decay: 0.001
            adam_epsilon: 0.00000001
    teacher:
        guidance_scale: 4.0
        negative_prompt: " "
        cfg_norm: layer_norm
    output_dir: ./output_train/qwen_image_edit_2511_dmd_lora

inference:
    method: image_infer
    # Edit validation follows the source aspect ratio at approximately this area.
    default_width: 1024
    default_height: 1024
    num_inference_steps: ${training.dmd.num_inference_steps}
    enable_cfg: false
    cfg_guidance_scale: 1.0
    negative_prompt: " "
    seed: 42
    # Raw edit training reuses the VAE to encode source images after validation.
    vae_cpu_offload: false
    vae_tiling: true
    output_dir: ./output_infer/qwen_image_edit_2511_dmd_lora
    infer_every_iters: ${training.save_every_iters}

logging:
    rank_zero_only: true
    train_log_every_iters: 10
    infer_log_every_steps: 1

resume:
    auto_resume: true
