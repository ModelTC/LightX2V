# Released six-step H3-Image -> two-step student, one ACP node / eight GPUs.
# The released PDD head at each original interval start supplies continuous scores.
# This head extension is experimental; the official PDMD loss/update recipe is unchanged.
seed: 42
model:
    name: minimax_h3_image
    pretrained_model_name_or_path: ${oc.env:H3_IMAGE_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: bf16
    local_files_only: true
    attention_backend: torch_sdpa
    sigma_head_policy: released_interval_start
    fake: {transformer_param_dtype: fp32}
    teacher: {transformer_param_dtype: bf16}
    capabilities:
        distribution_matching:
            projected_dmd: true
            official_pdmd: true
            image_loss_weight: 1.0
            official_pdmd_normalizer_floor: 0.00001
            official_pdmd_projection_epsilon: 0.00000001
            official_pdmd_loss_clamp: 5.0

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 8
        stream_load_pretrained: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: minimax_h3_image_cache_dataset
        data_path: ${oc.env:H3_IMAGE_CACHE}
        batch_size: 1
        num_workers: 4
        pin_memory: true
        shuffle: false
        drop_last: true

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.0
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    method: dmd
    max_train_iters: ${oc.env:H3_IMAGE_MAX_ITERS,15000}
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 2
    dmd:
        official_pdmd: true
        num_inference_steps: 2
        official_rollout_sigmas: [1.0, 0.75, 0.0]
        update_order: fake_first
        fake_update_ratio: 5
        model_mode: eval
        latent_dtype: fp32
        generation_shapes:
            - {value: [2048, 2048]}
        score_sampling:
            type: continuous_uniform
            min_sigma: 0.0
            max_sigma: 1.0
    student:
        train_type: lora
        ema: {enabled: false}
        lora:
            rank: 128
            alpha: 128
            param_dtype: fp32
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2, adaln_proj.linear, norm_out.linear]
            rank_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
            alpha_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
        optimizer:
            learning_rate: 0.00002
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    fake:
        train_type: full
        optimizer:
            learning_rate: 0.000004
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    teacher: {guidance_scale: 1.0, cfg_norm: none}
    output_dir: ${oc.env:H3_IMAGE_PDMD_OUTPUT}/train

inference: {method: none, infer_every_iters: null}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
