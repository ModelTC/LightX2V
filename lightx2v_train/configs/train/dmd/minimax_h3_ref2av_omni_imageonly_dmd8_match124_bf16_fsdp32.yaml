# Conditions-only Omni R2V image caches: no target-video encoding is required.
# BF16 caches and FSDP compute; FP32 student/fake/teacher master parameters.
# PDMD H3 optimization recipe: arXiv:2609.35768v1, Table C1 and Section C.2.
# H3-paper AdamW (0, 0.9), no WD, learning rates 5e-5 / 1e-5,
# and student -> critic x5 (not the 1:1 ablation).
# Train types and LoRA settings remain configurable; the current critic is
# full-parameter (unlike the paper's LoRA rank/alpha 128 critic).
# User overrides retained: Ref2AV image conditions, 8 NFE, 768p, global batch
# 32, and 10000 outer iterations (paper: T2AV, 4 NFE, 544p, global batch 16).
# Each outer iteration here is 1 student + 5 critic optimizer updates; the
# paper counts each optimizer update separately. This is not a full reproduction.
# Unspecified paper settings (epsilon, clipping, query grid) retain local values.
model:
    name: minimax_h3_ref2av
    pretrained_model_name_or_path: ${oc.env:H3_MODEL_PATH}
    running_dtype: bf16
    transformer_param_dtype: fp32
    local_files_only: true
    patch_size: [1, 2, 2]
    video_latent_channels: 24
    audio_latent_channels: 32
    text_dim: 5120
    vae_spatial_scale_factor: 16
    use_autocast: false
    attention_backend: _flash_3_hub
    fake:
        transformer_param_dtype: fp32
    capabilities:
        distribution_matching:
            video_flow_shift: 12.0
            audio_flow_shift: 3.0
            video_loss_weight: 1.0
            audio_loss_weight: 1.0
            audio_dmd_loss_weight: 1.0
            geometry_from_metadata: true
            allowed_resolutions: [[768, 1344], [1344, 768]]
            dmd_normalization: true
            dmd_normalization_epsilon: 0.0
            dmd_reduction: mean
            projected_dmd: true

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 32
        stream_load_pretrained: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: minimax_h3_ref_cache_dataset
        data_path: ${oc.env:H3_REF2AV_CACHE}
        defer_latent_loading: true
        # Per-rank microbatch = 1; count coverage spans the global 32 samples.
        batch_size: 1
        # Per rank: 8 workers; 32 ranks use 256 workers across four machines.
        num_workers: 8
        pin_memory: true
        shuffle: false
        drop_last: true
        reference_cost_sampler:
            seed: 42
            batch_mode: count_coverage
            require_image_only: true
            image_counts: [1, 2, 3, 4, 5, 6, 7, 8, 9]
            require_all_image_counts: false
            balance_image_counts: false
            cost_key: packed_sequence_tokens_124
            require_compute_cost: true
            balance_orientation: false
            strict_full_epoch: false
            remainder_policy: rotating_drop

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.02
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    # PDMD uses the DMD trainer with projected_dmd enabled above.
    method: dmd
    max_train_iters: 10000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 5
    dmd:
        num_inference_steps: 8
        update_order: student_first
        fake_update_ratio: 5
        latent_dtype: fp32
        # The cache fixes 124 target frames and selects portrait/landscape.
        generation_shapes:
            - {value: [124, 768, 1344]}
        score_sampling:
            type: h3_shifted_uniform
            video_flow_shift: ${model.capabilities.distribution_matching.video_flow_shift}
            discrete_samples: 1000
            min_sigma: 0.02
            max_sigma: 1.0
    student:
        train_type: lora
        lora:
            rank: 128
            alpha: 128
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
        optimizer:
            learning_rate: 0.00005
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    fake:
        train_type: full
        optimizer:
            learning_rate: 0.00001
            adam_beta1: 0.0
            adam_beta2: 0.9
            weight_decay: 0.0
            adam_epsilon: 0.00000001
    teacher: {guidance_scale: 1.0, cfg_norm: none}
    output_dir: ${oc.env:H3_REF2AV_DMD_OUTPUT}

inference: {method: none, infer_every_iters: null}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
