distributed:
    backend: auto
    dp:
        enabled: true

model:
    name: qwen_image_2_1
    pretrained_model_name_or_path: ${oc.env:QWEN_IMAGE_21_MODEL_PATH,/data/wushuo1/models/Qwen-Image-2.1}
    running_dtype: bf16

data:
    processor:
        name: qwen_image_2_1
        size_multiple: 32
        reference_image_area: 1048576
    train:
        name: image_dataset
        num_workers: 2
        prompt_dropout_rate: 0.0
        target_area: 1048576
        shuffle: true
        data_path:
            - ${oc.env:QWEN_IMAGE_21_TRAIN_DATA,/data/wushuo1/data/LightX2V_train_data_examples/dataset_v1/train.jsonl}
            - ${oc.env:QWEN_IMAGE_21_EDIT_TRAIN_DATA,/data/wushuo1/data/LightX2V_train_data_examples/dataset_edit/train.jsonl}
    val:
        name: image_dataset
        num_workers: 2
        shuffle: false
        data_path:
            - ${oc.env:QWEN_IMAGE_21_VAL_DATA,/data/wushuo1/data/LightX2V_train_data_examples/dataset_v1/val.jsonl}
            - ${oc.env:QWEN_IMAGE_21_EDIT_VAL_DATA,/data/wushuo1/data/LightX2V_train_data_examples/dataset_edit/val.jsonl}

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: logitnormal
    logitnormal_mean: 0.0
    logitnormal_std: 1.0
    min_sigma: 0.001
    max_sigma: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: exponential
        time_shift_power: 1.0
        dynamic_shift: true
        shift_mu_strategy: linear
        patch_size: [1, 1]
        shift_x1: 256
        shift_x2: 8192
        shift_y1: 0.5
        shift_y2: 0.9

training:
    method: flow_matching
    train_type: lora
    max_train_iters: 3000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 10
    save_every_iters: 100
    save_total_limit: 10
    lora:
        rank: 16
        alpha: 16
        target_modules:
            - attn.to_q
            - attn.to_k
            - attn.to_v
            - attn.to_out.0
    optimizer:
        learning_rate: 0.0001
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.01
        adam_epsilon: 0.00000001
    output_dir: ${oc.env:QWEN_IMAGE_21_OUTPUT_DIR,./output_train/qwen_image_2_1_lora}

inference:
    method: image_infer
    default_width: 1024
    default_height: 1024
    num_inference_steps: 40
    enable_cfg: false
    seed: 42
    output_dir: ${oc.env:QWEN_IMAGE_21_INFER_OUTPUT_DIR,./output_infer/qwen_image_2_1_lora}
    infer_every_iters: ${training.save_every_iters}

logging:
    rank_zero_only: true
    train_log_every_iters: 10
    infer_log_every_steps: 10

resume:
    auto_resume: true
