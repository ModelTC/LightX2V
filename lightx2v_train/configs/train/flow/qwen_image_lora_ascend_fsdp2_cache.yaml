runtime:
    platform: ${oc.env:PLATFORM,ascend_npu}

model:
    name: qwen_image
    pretrained_model_name_or_path: /data/wushuo1/models/Qwen-Image-2512
    max_sequence_length: 1024
    running_dtype: bf16

distributed:
    backend: auto
    timeout_minutes: 120
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        log_memory: true
        reshard_after_forward:
            root_reshard: false
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: cache_dataset
        num_workers: 2
        persistent_workers: true
        prefetch_factor: 2
        pin_memory: false
        prompt_dropout_rate: 0.1
        target_area: 1048576
        shuffle: true
        drop_last: false
        data_path:
            - /data/wushuo1/data/LightX2V_train_cache/qwen_image_2512/train/cache_data.jsonl

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: logitnormal
    logitnormal_mean: 0.0
    logitnormal_std: 1.0
    min_sigma: 0.001
    max_sigma: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: exponential
        time_shift_power: 1.0
        dynamic_shift: true
        shift_mu_strategy: linear
        patch_size: [2, 2]
        shift_x1: 256
        shift_x2: 8192
        shift_y1: 0.5
        shift_y2: 0.9

training:
    method: flow_matching
    train_type: lora
    max_train_iters: ${oc.decode:${oc.env:MAX_TRAIN_ITERS,3000}}
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 10
    save_every_iters: ${oc.decode:${oc.env:SAVE_EVERY_ITERS,100}}
    save_total_limit: 10
    lora:
        rank: 16
        alpha: 16
        target_modules:
            - to_k
            - to_q
            - to_v
            - to_out.0
    optimizer:
        learning_rate: 0.0001
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.01
        adam_epsilon: 0.00000001
    output_dir: ${oc.env:TRAIN_OUTPUT_DIR,/data/wushuo1/LightX2V/lightx2v_train/output_train/qwen_image_2512_lora_ascend_fsdp2}

inference:
    method: none
    infer_every_iters: null

logging:
    rank_zero_only: true
    train_log_every_iters: 1

resume:
    auto_resume: true
