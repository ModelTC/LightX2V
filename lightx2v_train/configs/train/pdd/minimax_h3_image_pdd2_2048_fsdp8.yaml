# Image PDD: 32 teacher-grid heads grouped into two inference steps.
# The released original single output head is an experimental continuous teacher.
seed: 42
model:
    name: minimax_h3_image
    pretrained_model_name_or_path: ${oc.env:H3_IMAGE_MODEL_PATH}
    image_head_mode: base
    running_dtype: bf16
    transformer_param_dtype: bf16
    local_files_only: true
    attention_backend: torch_sdpa

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2:
        enabled: true
        size: 8
        stream_load_pretrained: true
        reshard_after_forward: {root_reshard: false, block_reshard: true}
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: minimax_h3_image_cache_dataset
        data_path: ${oc.env:H3_IMAGE_CACHE}
        batch_size: 1
        num_workers: 4
        pin_memory: true
        shuffle: false
        drop_last: true

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.0
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    method: pdd
    train_type: lora
    max_train_iters: ${oc.env:H3_PDD_MAX_ITERS,30000}
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 2
    lora:
        rank: 128
        alpha: 128
        param_dtype: fp32
        target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2, adaln_proj.linear, norm_out.linear]
        rank_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
        alpha_pattern: {adaln_proj.linear: 16, norm_out.linear: 16}
    optimizer:
        learning_rate: 0.000005
        adam_beta1: 0.9
        adam_beta2: 0.99
        weight_decay: 0.0
        adam_epsilon: 0.00000001
    teacher: {guidance_scale: 1.0, cfg_norm: none}
    pdd:
        grid_size: 32
        num_inference_steps: 2
        video_shift: 12.0
        audio_shift: 3.0
        block_size_min: 16
        block_size_max: 16
        num_supervised_heads: 2
        teacher_solver: euler
        backward_simulation: staggered
        generation_shapes:
            - {value: [2048, 2048]}
    output_dir: ${oc.env:H3_PDD_OUTPUT}/train

inference: {method: none, infer_every_iters: null}
logging: {rank_zero_only: true, train_log_every_iters: 1}
resume: {auto_resume: true}
