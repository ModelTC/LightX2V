model:
    name: wan_t2v
    pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B
    max_sequence_length: 512
    running_dtype: bf16
    transformer_param_dtype: fp32
    vae_dtype: fp32
    load_vae: true
    load_text_encoder: true
    load_transformer: true
    fake:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B
    teacher:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-14B
        transformer_param_dtype: bf16
    student_2:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B
    fake_2:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-1.3B
    teacher_2:
        name: wan_t2v
        pretrained_model_name_or_path: models/Wan2.1-T2V-14B
        transformer_param_dtype: bf16
        share_with_teacher: true

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        reshard_after_forward:
            root_reshard: false
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: video_dataset
        data_path:
            - data/wan22/metadata.jsonl
        height: 480
        width: 832
        num_frames: 81
        frame_rate: 16
        fix_frame_rate: true
        random_start: true
        num_workers: 8
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: prompt_dataset
        data_path:
            - data/prompts/wan22_val_prompts.txt
        max_samples: 2
        num_workers: 0
        shuffle: false

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_t: 1.0e-3
    max_t: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: linear
        time_shift_mu: 7.0
        time_shift_power: 1.0
        sigma_min: 0.0
        extra_one_step: true

training:
    method: phased_dmd
    max_train_iters: 1000
    gradient_accumulation_iters: 2
    gradient_checkpointing: true
    max_grad_norm: 10.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 10
    dmd:
        ida:
            enabled: true
            decay: 0.97
        num_inference_steps: 4
        fake_update_ratio: 5
        div_loss:
            enabled: true
            weight: 5.0e-2
            teacher_inference_steps: 24
            anchor_step: 6
        generation_shapes:
            - {value: [81, 480, 832]}
        denoising_step_list:
            - 1000
            - 750
            - 500
            - 250
        warp_denoising_step: true
        num_train_timestep: 1000
        timestep_shift: 7.0
        norm_clip_min: 1.0e-4
        phased:
            match_timestep: 500
            enable_fake_low_high: false
            score_timestep_min: 20
            score_timestep_max: 980
            score_timestep_margin: 20
            guidance_distill: 5.0
            fake_real_high:
                enabled: true
                weight: 2.0e-1
                timestep_list:
                    - 750
            fake_real_low:
                enabled: true
                weight: 2.0e-1
                timestep_list:
                    - 500
    student:
        train_type: full
        optimizer:
            learning_rate: 2.0e-6
            adam_beta1: 0.0
            adam_beta2: 9.99e-1
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    fake:
        train_type: full
        optimizer:
            learning_rate: 4.0e-7
            adam_beta1: 0.0
            adam_beta2: 9.99e-1
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    student_2:
        train_type: full
        optimizer:
            learning_rate: 2.0e-6
            adam_beta1: 0.0
            adam_beta2: 9.99e-1
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    fake_2:
        train_type: full
        optimizer:
            learning_rate: 4.0e-7
            adam_beta1: 0.0
            adam_beta2: 9.99e-1
            weight_decay: 1.0e-2
            adam_epsilon: 1.0e-8
    teacher:
        guidance_scale: 5.0
        cfg_norm: none
    output_dir: ./output_train/wan2_1_t2v_1_3b_phased_dmd_div_fakereal

inference:
    method: wan_t2v_dual_infer
    default_width: 832
    default_height: 480
    num_frames: 81
    num_inference_steps: 4
    denoising_step_list:
        - 1000
        - 750
        - 500
        - 250
    boundary_step_index: 2
    warp_denoising_step: true
    fps: 16
    enable_cfg: false
    cfg_guidance_scale: 1.0
    seed: 42
    output_dir: ./output_infer/wan2_1_t2v_1_3b_phased_dmd_div_fakereal
    infer_every_iters: 10

logging:
    rank_zero_only: true
    train_log_every_iters: 1
    infer_log_every_steps: 1

resume:
    auto_resume: true
