# Local smoke experiment, not the paper's full-length curriculum.
# All pretrained components remain on GPU; video/T5 encode and VAE decode are online.
seed: 42
model:
    name: wan_t2v
    pretrained_model_name_or_path: ${oc.env:WAN_TURBO_MODEL,/data/nvme0/gushiqiao/models/official_models/Wan2.1-T2V-1.3B}
    running_dtype: fp32
    transformer_param_dtype: fp32
    vae_dtype: fp32
    t5_dtype: fp32
    t5_cpu: false
    attention_backend: sdpa
    max_sequence_length: 512
    sample_posterior: false
    load_vae: true
    load_text_encoder: true
    load_transformer: true
    fake: {running_dtype: fp32, transformer_param_dtype: fp32}
    teacher: {running_dtype: fp32, transformer_param_dtype: fp32}

distributed:
    backend: nccl
    timeout_minutes: 180
    sequence_parallel: {enabled: false, size: 1}
    fsdp2: {enabled: false, size: 1}

data:
    train:
        name: video_dataset
        data_path: ["${oc.env:WAN_TURBO_ROOT,/data/nvme6/gushiqiao/outputs/wan21_1_3b_turbo8_fp32_gpu0_smoke_20261028}/selection/train.jsonl"]
        video_column: video_path
        prompt_column: caption
        height: 480
        width: 832
        num_frames: 81
        frame_rate: 16
        fix_frame_rate: true
        random_start: false
        prompt_dropout_rate: 0.0
        skip_missing: false
        decode_retries: 3
        batch_size: 1
        dataset_repeat: 1
        num_workers: 2
        pin_memory: true
        shuffle: true
        drop_last: false
    val:
        name: prompt_dataset
        data_path: ["${oc.env:WAN_TURBO_ROOT,/data/nvme6/gushiqiao/outputs/wan21_1_3b_turbo8_fp32_gpu0_smoke_20261028}/selection/val.jsonl"]
        max_samples: 4
        num_workers: 0
        shuffle: false
        drop_last: false

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_sigma: 0.0
    max_sigma: 1.0
    time_shift_settings: {do_time_shift: false}

training:
    method: turbo
    allow_tf32: false
    max_train_iters: 300
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 2
    turbo:
        generation_shapes: [{value: [81, 480, 832]}]
        num_inference_steps: 8
        dcm_steps: 100
        scm_steps: 50
        joint_steps: 150
        fake_update_ratio: 4
        video_shift: 5.0
        audio_shift: 3.0
        dcm_total_steps: 48
        dcm_skip_steps: 1
        loss_scale: 100.0
        loss_scale_dmd: 1.0
        tangent_warmup_steps: 50
        generator_time_mean: -0.8
        generator_time_std: 1.6
        score_time_mean: 0.0
        score_time_std: 1.6
    student:
        train_type: lora
        ema: {enabled: true, decay: 0.99, use_for_inference: true}
        lora:
            rank: 128
            alpha: 128
            param_dtype: fp32
            target_modules: [q, k, v, o, ffn.0, ffn.2]
        optimizer:
            learning_rate: 0.00002
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    fake:
        train_type: full
        optimizer:
            learning_rate: 0.000004
            adam_beta1: 0.0
            adam_beta2: 0.999
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    teacher: {guidance_scale: 5.0, cfg_norm: none}
    output_dir: "${oc.env:WAN_TURBO_ROOT,/data/nvme6/gushiqiao/outputs/wan21_1_3b_turbo8_fp32_gpu0_smoke_20261028}/train"

inference:
    method: wan_turbo_infer
    default_height: 480
    default_width: 832
    num_frames: 81
    num_inference_steps: 8
    fps: 16
    seed: 42
    infer_every_iters: 100
    teacher_baseline_at_zero: false
    output_dir: "${oc.env:WAN_TURBO_ROOT,/data/nvme6/gushiqiao/outputs/wan21_1_3b_turbo8_fp32_gpu0_smoke_20261028}/infer"
logging: {rank_zero_only: true, train_log_every_iters: 1, infer_log_every_steps: 8}
resume: {auto_resume: true}
