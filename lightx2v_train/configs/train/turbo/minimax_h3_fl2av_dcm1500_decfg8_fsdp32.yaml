# H3 32-GPU dCM-only warm-up on the complete NEW full-target AV cache.
# 1,500 student updates; no sCM/JVP, no joint DMD, no fake optimizer updates.
# DeCFG is ON for fake/teacher scores; student and inference exclude it. Final student EMA initializes PDMD.
seed: 42
model:
  name: minimax_h3_t2av
  pretrained_model_name_or_path: ${oc.env:H3_MODEL_PATH,/mnt/lm_data_afs/gushiqiao/models/MiniMax-H3}
  running_dtype: bf16
  transformer_param_dtype: bf16
  local_files_only: true
  patch_size:
  - 1
  - 2
  - 2
  video_latent_channels: 24
  audio_latent_channels: 32
  text_dim: 5120
  vae_spatial_scale_factor: 16
  use_autocast: false
  attention_backend: _flash_3_hub
  fake:
    transformer_param_dtype: fp32
  teacher:
    transformer_param_dtype: bf16
  capabilities:
    distribution_matching:
      video_flow_shift: 12.0
      audio_flow_shift: 3.0
      video_loss_weight: 0.8
      audio_loss_weight: 0.8
      geometry_from_metadata: true
      allowed_resolutions: []
  training_adapter:
    enabled: true
    path: ${oc.env:H3_TRAINING_ADAPTER_PATH,/mnt/lm_data_afs/gushiqiao/models/MiniMax-H3-TrainingAdapter/model_for_comfy_dit.safetensors}
    scale: ${oc.decode:${oc.env:H3_TRAINING_ADAPTER_SCALE,1.0}}
    qkv_layout: comfy
    roles:
    - fake
    - teacher
distributed:
  backend: nccl
  timeout_minutes: 180
  sequence_parallel:
    enabled: false
    size: 1
  fsdp2:
    enabled: true
    size: 32
    stream_load_pretrained: true
    reshard_after_forward:
      root_reshard: false
      block_reshard: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      output_dtype: null
      cast_forward_inputs: false
data:
  train:
    name: minimax_h3_turbo_cm_dataset
    data_path: ${oc.env:H3_CM_CACHE}
    tasks:
    - t2av
    native_geometry: true
    batch_size: 1
    num_workers: 8
    pin_memory: true
    seed: 42
    shuffle: true
    drop_last: false
    defer_latent_loading: true
scheduler:
  num_train_timesteps: 1000
  timestep_distribution: uniform
  min_sigma: 0.0
  max_sigma: 1.0
  time_shift_settings:
    do_time_shift: false
training:
  method: turbo
  max_train_iters: 1500
  gradient_accumulation_iters: 1
  gradient_checkpointing: true
  max_grad_norm: 1.0
  lr_scheduler: constant
  lr_warmup_iters: 0
  save_every_iters: 500
  save_total_limit: 2
  turbo:
    num_inference_steps: 8
    dcm_steps: 1500
    scm_steps: 0
    joint_steps: 0
    fake_update_ratio: 5
    video_shift: 12.0
    audio_shift: 3.0
    dcm_total_steps: 48
    dcm_skip_steps: 1
    loss_scale: 100.0
    generator_time_mean: -0.8
    generator_time_std: 1.6
  student:
    train_type: lora
    ema:
      enabled: true
      decay: 0.999
      use_for_inference: true
    lora:
      rank: 128
      alpha: 128
      param_dtype: fp32
      target_modules:
      - to_q
      - to_k
      - to_v
      - to_out.0
      - ff.net.0.proj
      - ff.net.2
      - adaln_proj.linear
      - norm_out.linear
      rank_pattern:
        adaln_proj.linear: 16
        norm_out.linear: 16
      alpha_pattern:
        adaln_proj.linear: 16
        norm_out.linear: 16
    optimizer:
      learning_rate: 2.0e-05
      adam_beta1: 0.0
      adam_beta2: 0.999
      weight_decay: 0.01
      adam_epsilon: 1.0e-08
  fake:
    train_type: full
    optimizer:
      learning_rate: 4.0e-06
      adam_beta1: 0.0
      adam_beta2: 0.999
      weight_decay: 0.01
      adam_epsilon: 1.0e-08
  teacher:
    guidance_scale: 1.0
    cfg_norm: none
  output_dir: ${oc.env:H3_CM_OUTPUT}
inference:
  method: none
  infer_every_iters: null
logging:
  rank_zero_only: true
  train_log_every_iters: 1
resume:
  auto_resume: true
