model:
  name: wan_fastwam
  running_dtype: bf16
  model_path: /mnt/miaohua/charles/models/Wan2.2-TI2V-5B
  checkpoint_path: /mnt/miaohua/charles/models/fastwam_release/libero_uncond_2cam224.pt

data:
  train: &libero_data
    name: libero_fastwam_dataset
    dataset_dirs:
      - /mnt/miaohua/charles/datasets/FastWAM-LIBERO/extracted/libero_spatial_no_noops_lerobot
      - /mnt/miaohua/charles/datasets/FastWAM-LIBERO/extracted/libero_object_no_noops_lerobot
      - /mnt/miaohua/charles/datasets/FastWAM-LIBERO/extracted/libero_goal_no_noops_lerobot
      - /mnt/miaohua/charles/datasets/FastWAM-LIBERO/extracted/libero_10_no_noops_lerobot
    pretrained_norm_stats: /mnt/miaohua/charles/models/fastwam_release/libero_uncond_2cam224_dataset_stats.json
    # Static, read-only task embeddings shared with the matching DMD run.
    text_embedding_cache_dir: /mnt/miaohua/charles/codes/LightX2V_fastwam/lightx2v_train/runs/fastwam_libero_action_1step_dmd_lora_only/text_embeds_cache
    observation_only_video: true
    val_set_proportion: 0.01
    batch_size: 16
    num_workers: 8
  val:
    <<: *libero_data
    batch_size: 4

training:
  method: fastwam_joint_consistency
  train_video: true
  output_dir: runs/fastwam_libero_action_1step_consistency_joint_ts10
  max_train_iters: 30000
  gradient_accumulation_iters: 1
  gradient_checkpointing: false
  max_grad_norm: 1.0
  save_every_iters: 5000
  save_total_limit: 5
  save_final: true
  lr_scheduler: cosine
  lr_warmup_iters: 500
  student:
    train_type: lora
    lora:
      rank: 64
      alpha: 64
      dropout: 0.0
      target_modules: [q, k, v, o, ffn.0, ffn.2]
      modules_to_save: []
    optimizer:
      learning_rate: 1.0e-4
      weight_decay: 1.0e-2
      adam_beta1: 0.9
      adam_beta2: 0.95
      adam_epsilon: 1.0e-8
  action_consistency:
    # Flash-WAM's k=1000/2 trajectory stride; the EMA model is deployed at one step.
    target_steps: 10
    # Used only by the periodic diagnostic; training uses one teacher Euler bridge.
    teacher_reference_steps: 10
    ema_decay: 0.995
    consistency_loss_weight: 1.0
    flow_loss_weight: 0.2
    huber_c: 0.001

inference:
  infer_every_iters: 500
  num_samples: 16
  seed: 42

logging:
  train_log_every_iters: 10
  wandb:
    enable: true
    project: fastwam-action-consistency
    name: libero-joint-1step-consistency-ts10
    group: libero-joint-1step-consistency
    job_type: train
    tags: [fastwam, libero, action-consistency, joint, 1step, lora-only, 30k]

resume:
  auto_resume: false
  resume_ckpt_path: null

distributed:
  backend: nccl
  zero1:
    enabled: false
  sequence_parallel:
    enabled: false
