model:
    name: qwen_image
    pretrained_model_name_or_path: /root/yongyang/models/Qwen/Qwen-Image-2512
    # Optional model overrides for the frozen stage-1 CM.
    # stage1:
    #     pretrained_model_name_or_path: /root/yongyang/models/Qwen/Qwen-Image-2512
    max_sequence_length: 1024
    running_dtype: bf16

data:
    train:
        name: image_dataset
        num_workers: 8
        prompt_dropout_rate: 0.1
        target_area: 1048576
        shuffle: true
        data_path:
            - /root/yongyang/datasets/LightX2V_train_data_examples/dataset_v1/train.jsonl

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: logitnormal
    logitnormal_mean: 0.0
    logitnormal_std: 1.0
    min_t: 0.5
    max_t: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: exponential
        time_shift_power: 1.0
        dynamic_shift: true
        patch_size: [2, 2]
        shift_x1: 256
        shift_x2: 4096
        shift_y1: 0.5
        shift_y2: 1.15

training:
    method: consistency
    train_type: lora
    max_train_iters: 3000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 1.0
    lr_scheduler: constant
    lr_warmup_iters: 10
    save_every_iters: 100
    save_total_limit: 10
    consistency:
        algorithm: tcm
        mode: ct
        # Must point to the completed stage-1 CM checkpoint. Both the frozen
        # stage-1 branch and the trainable stage-2 branch initialize from it.
        stage1_checkpoint: ./output_train/qwen_image_cm_ct_lora/checkpoint-000003000
        transition_time: 0.5
        boundary_probability: 0.25
        boundary_weight: 0.1
        time_pair:
            mapping: ect
            q: 2.0
            ratio_limit: 0.999
            kimg_per_stage: 1.0
            min_r: 0.0
            safety_epsilon: 0.000001
        loss:
            distance: pseudo_huber
            huber_constant: 0.00000001
            weighting: inverse_delta
            normalize_by_numel: false
            computation_dtype: float32
    lora:
        rank: 16
        alpha: 16
        target_modules: [to_k, to_q, to_v, to_out.0]
    optimizer:
        learning_rate: 0.00005
        adam_beta1: 0.9
        adam_beta2: 0.999
        weight_decay: 0.0
        adam_epsilon: 0.00000001
    output_dir: ./output_train/qwen_image_tcm_ct_lora

inference:
    # TCM inference needs the composite stage-1/stage-2 denoiser; the native
    # Qwen pipeline only owns one transformer, so periodic inference is off.
    method: none

logging:
    rank_zero_only: true
    train_log_every_iters: 10

resume:
    auto_resume: true
