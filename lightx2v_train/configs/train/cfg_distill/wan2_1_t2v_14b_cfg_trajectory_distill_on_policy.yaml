model:
    name: wan_t2v_14b
    pretrained_model_name_or_path: models/Wan2.1-T2V-14B/
    max_sequence_length: 512
    running_dtype: bf16
    transformer_param_dtype: fp32
    vae_dtype: fp32
    load_vae: true
    load_text_encoder: true
    load_transformer: true
    teacher:
        name: wan_t2v_14b
        pretrained_model_name_or_path: models/Wan2.1-T2V-14B/
        transformer_param_dtype: bf16

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        reshard_after_forward:
            root_reshard: true
            block_reshard: true
        mixed_precision:
            param_dtype: bf16
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

data:
    train:
        name: prompt_dataset
        data_path:
            - data/prompts/wan22_train_prompts.txt
        height: 480
        width: 832
        batch_size: 1
        num_workers: 8
        pin_memory: true
        shuffle: true
        drop_last: true
    val:
        name: prompt_dataset
        data_path:
            - data/prompts/wan22_val_prompts.txt
        max_samples: 32
        batch_size: 1
        num_workers: 0
        shuffle: false

scheduler:
    num_train_timesteps: 1000
    timestep_distribution: uniform
    min_t: 0.001
    max_t: 1.0
    time_shift_settings:
        do_time_shift: true
        shift_type: linear
        time_shift_mu: 5.0
        time_shift_power: 1.0
        sigma_min: 0.0
        extra_one_step: true

training:
    method: video_cfg_trajectory_distill
    max_train_iters: 5000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 10.0
    lr_scheduler: cosine
    lr_warmup_iters: 200
    lr_min: 0.0000005
    save_every_iters: 100
    save_total_limit: 4
    cfg_distill: {}
    cfg_trajectory_distill:
        refresh_every_iters: 10
        rollout_steps: 50
        intervals: 10
        unipc_shift: 5.0
        rollout_policy: student
        uncond:
            enabled: false
            loss_weight: 0.5
    student:
        train_type: full
        optimizer:
            learning_rate: 0.000002
            adam_beta1: 0.9
            adam_beta2: 0.999
            weight_decay: 0.001
            adam_epsilon: 0.00000001
    teacher:
        guidance_scale: 5.0
        cfg_norm: none
    output_dir: ./output_train/wan2_1_t2v_14b_cfg_trajectory_distill_on_policy

inference:
    method: wan_t2v_14b_infer
    default_width: 832
    default_height: 480
    num_frames: 81
    num_inference_steps: 50
    scheduler_type: unipc
    unipc_shift: 5.0
    fps: 16
    enable_cfg: false
    cfg_guidance_scale: 1.0
    seed: 42
    output_dir: ./output_infer/wan2_1_t2v_14b_cfg_trajectory_distill_on_policy
    infer_every_iters: 50

logging:
    rank_zero_only: true
    train_log_every_iters: 1
    infer_log_every_steps: 10

resume:
    auto_resume: true
