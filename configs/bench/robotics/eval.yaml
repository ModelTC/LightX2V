benchmark: libero
config_json: null # existing configs/{fastwam,realtimewam} profile; CLI wins
ckpt: null # dense or already merged FastWAM checkpoint supported by LV
seed: 42
model:
  name: realtimewam
  model_path: null
  action_horizon: null
  native_config: null # resolved snapshot saved in manifest/jobs
  t5_cpu_offload: false
  vae_cpu_offload: false
  factory: null # optional module:factory(cfg), implementing the worker policy API
  options: {} # custom factory options
EVALUATION:
  output_dir: null
  dataset_stats_path: null
  num_inference_steps: null
  sigma_shift: null
  replan_steps: null # RoboTwin benchmark defaults to 24; LIBERO follows its profile
  max_steps: null # per-task benchmark limit unless explicitly overridden
  resume: false
MULTIRUN:
  num_gpus: 8
  max_tasks_per_gpu: 2
  chunk_size: 20
  task_sample_ratio: 1.0
dry_run: false
