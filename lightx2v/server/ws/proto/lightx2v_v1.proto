syntax = "proto3";

package lightx2v.v1;

option go_package = "github.com/livekit-examples/mock-avatar/proto;avatarv1";

message ClientMessage {
  oneof body {
    Start start = 1;
    Empty audio_start = 2;  // 开始发送音频
    AudioChunk audio = 3; // 音频片段
    Empty audio_end = 4;
    Interrupt interrupt = 5; // 打断
    SetPrompt set_prompt = 6; // 设置提示词
    SetImage set_image = 7; // 切换参考图
  }
}

message ServerMessage {
  oneof body {
    ServerEvent event = 1; // 事件
    VideoStart video_start = 2; // 视频开始
    VideoChunk video = 3; // 视频片段
    Failure error = 4; // 错误
  }
}

message ServerEvent {
  enum Type {
    START_SPEAKING = 0; // 开始说话
    STOP_SPEAKING = 1;  // 说话结束，可能因为音频播放完毕或者中断
    PROMPT_UPDATE = 2; // 提示词更新
    IMAGE_UPDATE = 3; // 参考图实际切换成功
  }

  Type type = 1;
  string message = 2;
  string request_id = 3;
  string command_id = 4;
}

message Start {
  string request_id = 1;
  string audio_format = 2;
  repeated bytes audio_data = 3; // 完整 PCM WAV 参考音频（当前 RefA2AV 使用一份）
  string image_fromat = 4;
  repeated bytes image_data = 5;
  string prompt = 6;
  string negative_prompt = 7;
  int64 seed = 8;
  string aspect_ratio = 9;   // 1:1 | 16:9 | 9:16, default 16:9
  uint32 chunk_frames = 10;  // 分片帧数，默认8帧，fps=16时等于0.5s
  map<string, string> config_json = 11;  // e.g. {"output_url":"rtmp://...","resolution":"480p"}
}

message AudioChunk {
  uint64 sequence = 1;
  bytes data = 3;
}

message VideoChunk {
  uint64 sequence = 1;
  bytes audio_data = 2;  // pcm_s16le / mono，采样率由模型配置决定，H3 默认 24000
  bytes video_data = 3;  // H.264 Annex-B access units
}

// 只有模型产出后才知道尺寸, 当前只有最小满足字段，后续需要补充fps等其他信息
message VideoStart {
  int32 video_width = 1;
  int32 video_height = 2;
}

message Interrupt {
  string reason = 1;
  string command_id = 2;
}

message SetPrompt {
  string prompt = 1;
  float duration = 2;  // -1=until next SetPrompt, 0/omit=server default, >0=client seconds
  string command_id = 3;
}

message SetImage {
  bytes image_data = 1;
  string image_format = 2;
  string command_id = 3;
}

message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string request_id = 4;
  string command_id = 5;
}

message Empty {}
